<div class="recipe-card {{category}}-card organic" onclick="openModal({{idx}})">
  <div class="card-banner {{category}}">
    <span class="card-emoji">{{emoji}}</span>
    <span class="card-cat-pill">{{category}}</span>
  </div>
  <div class="card-body">
    <h3 class="card-title">{{title}}</h3>
    <div class="card-chips">
      <span class="chip">🧂 {{ingredientsCount}} ingredientes</span>
      <span class="chip">👨‍🍳 {{stepsCount}} passos</span>
    </div>
    <div class="card-preview">{{ingredientsPreview}} e mais...</div>
    <button class="card-btn">Ver receita completa</button>
  </div>
</div>
