<div class="recipe-card editorial" onclick="openModal({{idx}})">
  <div class="card-category">{{emoji}} {{category}}</div>
  <h3 class="card-title">{{title}}</h3>
  <div class="card-meta">
    <span>{{ingredientsCount}} ingredientes</span>
    <span>{{stepsCount}} passos</span>
  </div>
  <div class="card-ingredients-preview">{{ingredientsPreviewDots}}&hellip;</div>
  <div class="card-cta">Ver receita completa</div>
</div>
