<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa & Sabor — Receitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/designs/editorial/editorial.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header id="app-header"></header>
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h1>Sabores<em>de Portugal</em></h1>
          <p>
            Receitas tradicionais da cozinha portuguesa, com ingredientes
            simples e o amor de sempre.
          </p>
          <div class="hero-stats">
            <div class="stat">
              <span class="stat-num">136</span>
              <span class="stat-label">Receitas</span>
            </div>
            <div class="stat">
              <span class="stat-num">4</span>
              <span class="stat-label">Categorias</span>
            </div>
            <div class="stat">
              <span class="stat-num">∞</span>
              <span class="stat-label">Sabor</span>
            </div>
          </div>
        </div>
        <div class="hero-ornament">
          <div class="ornament-circle">🍽️</div>
        </div>
      </div>
    </section>
    <div id="filter-bar-container"></div>
    <div id="style-switcher-container"></div>
    <div class="ornamental-divider">✦ ✦ ✦</div>
    <section class="recipes-section">
      <div id="recipe-grid" class="recipe-grid"></div>
    </section>
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
      <div class="modal" id="modal-content"></div>
    </div>
    <footer id="app-footer"></footer>
    <script type="module" src="/designs/editorial/editorial.js"></script>
  </body>
</html>
