<div class="recipe-card retro" onclick="openModal({{idx}})">
  <div class="card-number">
    Receita N.º {{displayIndex}} · {{categoryLabel}}
  </div>
  <h3 class="card-title">{{title}}</h3>
  <div class="card-rule"></div>
  <div class="card-meta">
    <span>☙ {{ingredientsCount}} ingredientes</span>
    <span>☙ {{stepsCount}} passos</span>
  </div>
  <p class="card-body-text">
    {{ingredientsPreview}}, entre outros ingredientes essenciais da cozinha
    portuguesa.
  </p>
  <div class="card-link">Consultar receita</div>
</div>
